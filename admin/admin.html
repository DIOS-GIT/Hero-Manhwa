<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — Convertite en Leyenda</title>
<link rel="stylesheet" href="css/admin.css" />
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body>

<div id="login-screen">
  <form id="login-form" class="login-box">
    <h1>Panel de administración</h1>
    <p class="hint">Convertite en Leyenda</p>
    <label>Email</label>
    <input type="email" id="login-email" required autocomplete="username" />
    <label>Contraseña</label>
    <input type="password" id="login-pass" required autocomplete="current-password" />
    <button type="submit">Entrar</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="admin-screen" class="hidden">
  <header>
    <h1>🎮 Convertite en Leyenda — Admin</h1>
    <div class="header-right">
      <span id="whoami"></span>
      <button id="logout-btn">Salir</button>
    </div>
  </header>
  <div class="layout">
    <nav id="nav"></nav>
    <main id="sections"></main>
  </div>
</div>

<script src="../js/story-engine.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
